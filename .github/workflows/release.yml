name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  package:
    name: Build tagged package
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Verify tag matches package version
        run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      - name: Run type check
        run: npm run type

      - name: Build package
        run: npm run build

      - name: Pack installable artifact
        run: npm pack --ignore-scripts

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: cesium-mvt-imagery-provider-${{ github.ref_name }}
          path: "*.tgz"
          if-no-files-found: error

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" ./*.tgz --verify-tag --generate-notes
